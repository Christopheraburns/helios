# Ossie -> ontology mapping for the published TPC-DS model.
# Validated against ../mapping.schema.yaml (class SourceMapping).
# Element names follow models/published/tpcds.ossie.yaml: datasets are named
# after TPC-DS tables, relationships "<table>__<column>__<target>", metrics by name.
# This is the file propose_ontology will generate and the console review UI will approve.

model: tpcds.ossie.yaml
ontology_version: helios_retail@0.2.0
database: tpcds

entities:
  - ossie_element: customer
    class: Customer
    identifiers:
      primary: [c_customer_sk]
      secondary: [c_customer_id, c_email_address]
      display: [c_first_name, c_last_name]
      aliases: []
      alias_templates:
        - "{c_salutation} {c_last_name}"
        - "{c_first_name} {c_last_name}"
    attributes:
      - attribute: email
        columns: [c_email_address]
      - attribute: customer_id
        columns: [c_customer_id]

  - ossie_element: store
    class: Store
    identifiers:
      primary: [s_store_sk]
      secondary: [s_store_id]
      display: [s_store_name]
      aliases: []
      alias_templates:
        - "{s_city} store"
    attributes:
      - attribute: store_id
        columns: [s_store_id]
      - attribute: address
        columns: [s_street_number, s_street_name, s_city, s_state, s_zip]
      - attribute: market
        columns: [s_market_id]

  - ossie_element: warehouse
    class: Warehouse
    identifiers:
      primary: [w_warehouse_sk]
      secondary: [w_warehouse_id]
      display: [w_warehouse_name]
    attributes:
      - attribute: warehouse_id
        columns: [w_warehouse_id]
      - attribute: address
        columns: [w_street_number, w_street_name, w_city, w_state, w_zip]

  - ossie_element: item
    class: Item
    identifiers:
      primary: [i_item_sk]
      secondary: [i_item_id]
      display: [i_product_name]
      aliases: []
      alias_templates:
        - "{i_color} {i_class} item"
        - "{i_color} {i_class}"
    attributes:
      - attribute: item_id
        columns: [i_item_id]
      - attribute: sku
        columns: [i_item_id]
      - attribute: category
        columns: [i_category]
      - attribute: color
        columns: [i_color]
      - attribute: item_class
        columns: [i_class]

  # Brand is a label on the item table, grouped by brand ID.
  - ossie_element: item
    class: Brand
    identifiers:
      primary: [i_brand_id]
      display: [i_brand]
      aliases: [i_brand]
    attributes:
      - attribute: brand_id
        columns: [i_brand_id]

  - ossie_element: reason
    class: Reason
    identifiers:
      primary: [r_reason_sk]
      secondary: [r_reason_id]
      display: [r_reason_desc]
      aliases: [r_reason_desc]
    attributes:
      - attribute: reason_id
        columns: [r_reason_id]

  - ossie_element: promotion
    class: Promotion
    identifiers:
      primary: [p_promo_sk]
      secondary: [p_promo_id]
      display: [p_promo_name]
    attributes:
      - attribute: promo_id
        columns: [p_promo_id]
      - attribute: channel
        columns: [p_channel_email, p_channel_catalog, p_channel_tv]

  - ossie_element: store_sales
    class: Sale
    identifiers:
      primary: [ss_ticket_number, ss_item_sk]
      secondary: [ss_ticket_number]
      display: [ss_ticket_number]
    attributes:
      - attribute: ticket_number
        columns: [ss_ticket_number]
      - attribute: amount
        columns: [ss_net_paid]

  - ossie_element: store_returns
    class: Return
    identifiers:
      primary: [sr_ticket_number, sr_item_sk]
      secondary: [sr_ticket_number]
      display: [sr_ticket_number]
    attributes:
      - attribute: amount
        columns: [sr_return_amt]

relationships:
  - ossie_relationship: store_sales__ss_customer_sk__customer
    edge: PartyTo
  - ossie_relationship: store_sales__ss_store_sk__store
    edge: LocatedAt
  - ossie_relationship: store_sales__ss_item_sk__item
    edge: Contains
  - ossie_relationship: store_returns__sr_customer_sk__customer
    edge: PartyTo
  - ossie_relationship: store_returns__sr_store_sk__store
    edge: LocatedAt
  - ossie_relationship: store_returns__sr_item_sk__item
    edge: Contains
  - ossie_relationship: store_returns__sr_reason_sk__reason
    edge: HasReason
  # Return -> Sale (ReturnOf) has no Ossie relationship: TPC-DS joins them on
  # (ticket number, item), not a foreign key. It is declared under anchors.

concepts:
  - glossary_term: "Net Revenue"
    class: SemanticConcept
    ossie_element: metrics.store_sales_revenue
  - glossary_term: "Return Amount"
    class: SemanticConcept
    ossie_element: metrics.store_returns_amount

resolution:
  scope:
    # The Helios-DS corpus: PDF, email and chat about store returns.
    - source_pattern: "s3a://applied-ai-buk-d5eff1ab/helios-db/source/datasets/**"
      candidate_classes: [Customer, Item, Brand, Store, Sale, Return, Reason]
  thresholds:
    alias_min_score: 0.92
    fuzzy_min_score: 0.85
    model_assisted_min_confidence: 0.80

# Record anchors: the warehouse row a case's documents are about, and how to
# find it. Here a case is one return of one sale. The crawler builds one bounded
# query from this (apps/helios/crawler/anchors.py); it knows no class by name.
anchors:
  - class: Return
    # Values in documents that constrain the return's row. A receipt or ticket
    # number is looked up in either table's ticket column; it identifies the sale.
    lookups:
      - column: sr_ticket_number
        match: equals
        type: integer
        source_columns: [sr_ticket_number, ss_ticket_number]
        identifies: Sale
      - column: sr_ticket_number
        match: ends_with            # "receipt ending in 5079"
        type: integer
        source_columns: [sr_ticket_number, ss_ticket_number]
        identifies: Sale
    # What the return's row names, and the relationship each makes.
    joins:
      - {column: sr_customer_sk, class: Customer, edge: PartyTo}
      - {column: sr_item_sk, class: Item, edge: Contains}
      - {column: sr_reason_sk, class: Reason, edge: HasReason}
      - {column: sr_store_sk, class: Store, edge: LocatedAt}
    # Brand is a label on the item row the return joins to.
    colocated:
      - {via: Item, class: Brand}
    # TPC-DS stores dates as keys into date_dim.
    date: {column: sr_returned_date_sk, table: date_dim, key: d_date_sk, value: d_date}
    related:
      - class: Sale
        join_on:
          - [sr_ticket_number, ss_ticket_number]
          - [sr_item_sk, ss_item_sk]
        edge: ReturnOf
        joins:
          - {column: ss_customer_sk, class: Customer, edge: PartyTo}
          - {column: ss_item_sk, class: Item, edge: Contains}
          - {column: ss_store_sk, class: Store, edge: LocatedAt}
        date: {column: ss_sold_date_sk, table: date_dim, key: d_date_sk, value: d_date}
        # The documents name one customer and one store for the purchase and the return.
        share_anchor_entities: true
    row_limit: 5
    min_constraint_kinds: 2
