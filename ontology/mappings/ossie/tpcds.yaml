# Ossie -> ontology mapping for the TPC-DS sample model.
# Validated against ../mapping.schema.yaml (class SourceMapping).
# This is the file propose_ontology will generate and the console review UI will approve.

model: tpcds.ossie.yaml
ontology_version: helios_retail@0.1.0

entities:
  - ossie_element: dim_customer
    class: Customer
    identifiers:
      primary: [c_customer_sk]
      secondary: [c_customer_id, c_email_address]
      display: [c_first_name, c_last_name]
      aliases: []
    attributes:
      - attribute: email
        columns: [c_email_address]
      - attribute: customer_id
        columns: [c_customer_id]

  - ossie_element: dim_store
    class: Store
    identifiers:
      primary: [s_store_sk]
      secondary: [s_store_id]
      display: [s_store_name]
      aliases: [s_store_name, s_market_desc]
    attributes:
      - attribute: store_id
        columns: [s_store_id]
      - attribute: address
        columns: [s_street_number, s_street_name, s_city, s_state, s_zip]
      - attribute: market
        columns: [s_market_id]

  - ossie_element: dim_warehouse
    class: Warehouse
    identifiers:
      primary: [w_warehouse_sk]
      secondary: [w_warehouse_id]
      display: [w_warehouse_name]
    attributes:
      - attribute: warehouse_id
        columns: [w_warehouse_id]
      - attribute: address
        columns: [w_street_number, w_street_name, w_city, w_state, w_zip]

  - ossie_element: dim_item
    class: Item
    identifiers:
      primary: [i_item_sk]
      secondary: [i_item_id]
      display: [i_product_name]
      aliases: [i_item_desc]
    attributes:
      - attribute: item_id
        columns: [i_item_id]
      - attribute: sku
        columns: [i_item_id]
      - attribute: brand
        columns: [i_brand]
      - attribute: category
        columns: [i_category]

  - ossie_element: dim_promotion
    class: Promotion
    identifiers:
      primary: [p_promo_sk]
      secondary: [p_promo_id]
      display: [p_promo_name]
    attributes:
      - attribute: promo_id
        columns: [p_promo_id]
      - attribute: channel
        columns: [p_channel_email, p_channel_catalog, p_channel_tv]

relationships:
  - ossie_relationship: "store_sales.ss_customer_sk -> dim_customer"
    edge: PartyTo
  - ossie_relationship: "store_sales.ss_store_sk -> dim_store"
    edge: LocatedAt
  - ossie_relationship: "store_sales.ss_item_sk -> dim_item"
    edge: Mentions
  - ossie_relationship: "store_returns.sr_customer_sk -> dim_customer"
    edge: PartyTo

concepts:
  - glossary_term: "Net Revenue"
    class: SemanticConcept
    ossie_element: measures.net_revenue
  - glossary_term: "Return Rate"
    class: SemanticConcept
    ossie_element: measures.return_rate

resolution:
  scope:
    - source_pattern: "s3://helios-ds/customers/**"
      candidate_classes: [Customer, Contract]
    - source_pattern: "s3://helios-ds/stores/**"
      candidate_classes: [Store, Warehouse, Equipment]
    - source_pattern: "s3://helios-ds/products/**"
      candidate_classes: [Item, Promotion]
  thresholds:
    alias_min_score: 0.92
    fuzzy_min_score: 0.85
    model_assisted_min_confidence: 0.80
