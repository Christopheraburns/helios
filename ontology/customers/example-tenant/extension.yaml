id: https://helios.dev/ontology/customers/example-tenant
name: helios_customer_example_tenant
title: Example Tenant Extension
version: 0.1.0
description: >-
  Customer-specific extension. Generated by propose_ontology, reviewed in the
  console, then published. May add subclasses, attributes and aliases under core
  or a pack; may not redefine anything it imports.

prefixes:
  linkml: https://w3id.org/linkml/
  helios: https://helios.dev/ontology/
default_prefix: helios
default_range: string

imports:
  - linkml:types
  - ../../packs/retail/retail

classes:
  FranchisePartner:
    is_a: Organization
    description: A franchisee operating one or more stores; not present in the retail pack.
    attributes:
      franchise_id:
        range: string
      operates:
        range: Store
        multivalued: true

  StoreIncident:
    is_a: Incident
    description: Loss-prevention or safety incident reported at a store.
    attributes:
      store:
        range: Store
      reported_by:
        range: Person
