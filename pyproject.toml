[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-monorepo"
version = "0.1.0"
description = "Helios semantic query layer + Helios-DS synthetic data generator"
authors = [{name = "Helios Team"}]

[tool.hatch.build.targets.wheel]
packages = ["shared", "apps"]

[tool.pytest.ini_options]
testpaths = ["apps/helios/tests"]
pythonpath = ["shared", "apps/helios"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"
