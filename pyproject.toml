[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Workspace root. Until Phase 8 moves the console into apps/console, the root
# project also installs the `apps` namespace (console, crawler, graph, MCP server)
# so `apps.helios.*` imports resolve without PYTHONPATH.
[project]
name = "helios-apps"
version = "0.1.0"
description = "Helios console, crawler, graph gateway and MCP server (pre-split)"
authors = [{name = "Helios Team"}]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
# Mirrors apps/helios/console/requirements.txt, which Workbench still installs from.
dependencies = [
    "helios-core",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "httpx2>=2.13.1",
    "jinja2>=3.1.0",
    "mcp>=2.2.0,<3",
    "pypdf>=6.0.0",  # crawler: PDF text extraction
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.14.0",  # crawler: typo-tolerant name matching
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
evidence = ["helios-core[evidence]"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8.0",
    "reportlab>=4.0", # crawler test fixtures render PDFs
    "ruff>=0.6.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
helios-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.pytest.ini_options]
testpaths = ["packages/helios-core/tests", "apps/helios/tests"]

[tool.importlinter]
root_packages = ["helios_core"]
include_external_packages = true  # so apps.* and sibling packages can be named

[[tool.importlinter.contracts]]
name = "helios-core imports no app code and no sibling package"
type = "forbidden"
source_modules = ["helios_core"]
forbidden_modules = [
    "apps",
    "helios_model",
    "helios_serve",
    "helios_mcp",
    "helios_cloudera",
    "helios_crawl",
]

[[tool.importlinter.contracts]]
# Feature code waiting for its package (see helios_core/_pending/__init__.py).
# The source is core's children, not helios_core itself: import-linter skips a
# forbidden module that sits inside the source package.
name = "only _pending imports helios_core._pending"
type = "forbidden"
source_modules = ["helios_core.*"]
forbidden_modules = ["helios_core._pending"]
ignore_imports = ["helios_core._pending.** -> helios_core._pending.**"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/helios-ds-generation", "apps/helios-ds-evaluation"]

[tool.ruff.lint]
# Ruff's classic defaults: pyflakes plus the pycodestyle error rules.
select = ["E4", "E7", "E9", "F"]
