[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Workspace root. Until Phase 8 moves the console into apps/console, the root
# project also installs the `apps` namespace (console, crawler, graph, MCP server)
# so `apps.helios.*` imports resolve without PYTHONPATH.
[project]
name = "helios-apps"
version = "0.1.0"
description = "Helios console, crawler, graph gateway and MCP server (pre-split)"
authors = [{name = "Helios Team"}]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
# Mirrors apps/helios/console/requirements.txt, which Workbench still installs from.
dependencies = [
    "helios-cloudera",
    "helios-model",
    "helios-serve",
    "helios-semantic",
    "helios-mcp",
    "helios-cortex[azure,gcs,llm,ontology,ozone,postgres,s3,trino]",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "httpx2>=2.13.1",
    "jinja2>=3.1.0",
    "mcp>=2.2.0,<3",
    "pypdf>=6.0.0",  # crawler: PDF text extraction
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.14.0",  # crawler: typo-tolerant name matching
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
evidence = ["helios-cortex[evidence]"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "moto[server]>=5.0", # an in-process S3 server for the artifact storage tests
    "pytest>=8.0",
    "reportlab>=4.0", # crawler test fixtures render PDFs
    "ruff>=0.6.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
helios-cortex = { workspace = true }
helios-cloudera = { workspace = true }
helios-model = { workspace = true }
helios-serve = { workspace = true }
helios-semantic = { workspace = true }
helios-mcp = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.pytest.ini_options]
testpaths = [
    "packages/helios-cortex/tests",
    "packages/helios-cloudera/tests",
    "packages/helios-model/tests",
    "packages/helios-serve/tests",
    "packages/helios-semantic/tests",
    "packages/helios-mcp/tests",
    "tests/integration",
    "apps/helios/tests",
]

[tool.importlinter]
root_packages = ["helios_cortex", "helios_cloudera", "helios_model", "helios_serve", "helios_semantic", "helios_mcp"]
include_external_packages = true  # so apps.* and sibling packages can be named

[[tool.importlinter.contracts]]
name = "helios-cortex imports no app code and no sibling package"
type = "forbidden"
source_modules = ["helios_cortex"]
forbidden_modules = [
    "helios_semantic",
    "apps",
    "helios_model",
    "helios_serve",
    "helios_mcp",
    "helios_cloudera",
    "helios_crawl",
]

[[tool.importlinter.contracts]]
name = "helios-cloudera imports no app code and no sibling package but helios-cortex"
type = "forbidden"
source_modules = ["helios_cloudera"]
forbidden_modules = [
    "helios_semantic",
    "apps",
    "helios_model",
    "helios_serve",
    "helios_mcp",
    "helios_crawl",
    "helios_cortex._pending",
]

[[tool.importlinter.contracts]]
# Engines and catalogs reach helios-model through plugins, never by import.
name = "helios-model imports no app code and no sibling package but helios-cortex"
type = "forbidden"
source_modules = ["helios_model"]
forbidden_modules = [
    "helios_semantic",
    "apps",
    "helios_cloudera",
    "helios_serve",
    "helios_mcp",
    "helios_crawl",
    "helios_cortex._pending",
]

[[tool.importlinter.contracts]]
# The tools are plain functions over published models: no MCP SDK (Daedalus and
# helios-mcp serve them), no web framework, and no model discovery.
name = "helios-serve imports no app code, no MCP and no sibling package but helios-cortex"
type = "forbidden"
source_modules = ["helios_serve"]
forbidden_modules = [
    "helios_semantic",
    "apps",
    "mcp",
    "fastapi",
    "starlette",
    "helios_model",
    "helios_cloudera",
    "helios_mcp",
    "helios_crawl",
    "helios_cortex._pending",
]

[[tool.importlinter.contracts]]
# The umbrella composes the libraries; engines and catalogs still arrive as plugins.
name = "helios-semantic imports no app code, no MCP and no plugin package"
type = "forbidden"
source_modules = ["helios_semantic"]
forbidden_modules = [
    "apps",
    "mcp",
    "fastapi",
    "starlette",
    "helios_cloudera",
    "helios_mcp",
    "helios_crawl",
    "helios_cortex._pending",
]

[[tool.importlinter.contracts]]
# The local stdio adapter (decision 8): the registry's tools through the MCP SDK and
# nothing else. No HTTP server of its own, no discovery, no plugin package by import.
name = "helios-mcp imports no app code, no web server and no sibling package but helios-serve and helios-cortex"
type = "forbidden"
source_modules = ["helios_mcp"]
forbidden_modules = [
    "apps",
    "fastapi",
    "starlette",
    "uvicorn",
    "helios_model",
    "helios_cloudera",
    "helios_semantic",
    "helios_crawl",
    "helios_cortex._pending",
]

[[tool.importlinter.contracts]]
# Feature code waiting for its package (see helios_cortex/_pending/__init__.py).
# The source is core's children, not helios_cortex itself: import-linter skips a
# forbidden module that sits inside the source package.
name = "only _pending imports helios_cortex._pending"
type = "forbidden"
source_modules = ["helios_cortex.*"]
forbidden_modules = ["helios_cortex._pending"]
ignore_imports = ["helios_cortex._pending.** -> helios_cortex._pending.**"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/helios-ds-generation", "apps/helios-ds-evaluation"]

[tool.ruff.lint]
# Ruff's classic defaults: pyflakes plus the pycodestyle error rules.
select = ["E4", "E7", "E9", "F"]
