- name: household_demographics
  source: tpcds.household_demographics
  description: A dimension table that describes household-level demographic profiles, including income band, buying potential,
    number of dependents, and vehicle ownership. Each row represents a unique household demographic profile used to segment
    customers across sales and returns transactions.
  fields:
  - name: hd_demo_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hd_demo_sk
    label: Household Demographics Key
    description: Unique surrogate key that identifies each household demographic profile.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Household Demographics
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"identifier","engine_type":"bigint","confidence":1.0,"glossary_terms":["Household Demographics"]}'
  - name: hd_income_band_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hd_income_band_sk
    label: Income Band Key
    description: Foreign key reference to the Income Band dimension table, linking each household to its annual income range.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Income Band
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"foreign_key","engine_type":"bigint","confidence":0.98,"refers_to":"tpcds.income_band.ib_income_band_sk","glossary_terms":["Income
        Band"]}'
  - name: hd_buy_potential
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hd_buy_potential
    label: Buy Potential
    description: Estimated household annual spending band, categorized into ranges such as 0-500, 500-1000, 1000-5000, 5000-10000,
      10000-50000, or Unknown.
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Buy Potential
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"string","confidence":0.95,"glossary_terms":["Buy Potential"]}'
  - name: hd_dep_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hd_dep_count
    label: Dependent Count
    description: Number of dependents in the household, ranging from 0 to 9.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Dependent Count
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.98,"glossary_terms":["Dependent Count"]}'
  - name: hd_vehicle_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hd_vehicle_count
    label: Vehicle Count
    description: Number of vehicles owned by the household, ranging from -1 (unknown) to 4.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Vehicle Count
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"int","confidence":0.95,"glossary_terms":["Vehicle Count"]}'
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"kind":"dimension","confidence":0.95,"run_id":"20260922T000009Z"}'
  primary_key:
  - hd_demo_sk
- name: income_band
  source: tpcds.income_band
  description: A lookup table that defines household annual income ranges. Each row represents a distinct income band with
    a lower and upper bound, used to segment customers and households by income level.
  fields:
  - name: ib_income_band_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ib_income_band_sk
    label: Income Band Key
    description: Unique surrogate key that identifies each income band record.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Income Band
