version: 0.2.0.dev0
name: tpcds
description: 'The TPC-DS store-sales star: store_sales and the six tables it joins to, a sample to try Helios on (helios init
  --sample). Trimmed from the TPC-DS model Helios proposed from a Cloudera warehouse and a person reviewed (models/published/tpcds.ossie.yaml).'
ai_context:
  instructions: Semantic model generated by helios from warehouse evidence and reviewed by a human. Field labels are business
    names; custom_extensions carry helios provenance.
datasets:
- name: customer_demographics
  source: tpcds.customer_demographics
  description: A dimension table containing demographic attributes for customers, including gender, marital status, education
    level, credit rating, and household composition. This table is referenced across all sales and returns transactions to
    enable demographic analysis and segmentation.
  fields:
  - name: cd_demo_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cd_demo_sk
    label: Customer Demographics Key
    description: Unique surrogate key identifying each customer demographic profile record.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Customer Demographics
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"identifier","engine_type":"bigint","confidence":0.99,"glossary_terms":["Customer Demographics"]}'
  - name: cd_gender
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cd_gender
    label: Gender
    description: Customer gender, either Female (F) or Male (M).
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Gender
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"string","confidence":0.99,"glossary_terms":["Gender"]}'
  - name: cd_marital_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cd_marital_status
    label: Marital Status
    description: Customer marital status code, such as Divorced (D), Married (M), Single (S), Widowed (W), or Unknown.
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Marital Status
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"string","confidence":0.99,"glossary_terms":["Marital Status"]}'
  - name: cd_education_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cd_education_status
    label: Education Status
    description: Highest education level attained by the customer, including categories such as 2 yr Degree, 4 yr Degree,
      Advanced Degree, High School, Primary, and Unknown.
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Education Status
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"string","confidence":0.99,"glossary_terms":["Education Status"]}'
  - name: cd_purchase_estimate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cd_purchase_estimate
    label: Purchase Estimate
    description: Estimated annual purchase amount band for the customer in whole currency units, ranging from $500 to $10,000
      in increments.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Purchase Estimate
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.95,"glossary_terms":["Purchase Estimate"]}'
  - name: cd_credit_rating
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cd_credit_rating
    label: Credit Rating
    description: Credit risk classification of the customer, such as Good, Fair, Poor, or Unknown.
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Credit Rating
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"string","confidence":0.99,"glossary_terms":["Credit Rating"]}'
  - name: cd_dep_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cd_dep_count
    label: Dependent Count
    description: Total number of dependents in the customer's household, ranging from 0 to 6.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Dependent Count
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.99,"glossary_terms":["Dependent Count"]}'
  - name: cd_dep_employed_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cd_dep_employed_count
    label: Employed Dependent Count
    description: Number of dependents in the customer's household who are employed, ranging from 0 to 6.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Employed Dependent Count
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.99,"glossary_terms":["Employed Dependent Count"]}'
  - name: cd_dep_college_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cd_dep_college_count
    label: College Dependent Count
    description: Number of dependents in the customer's household who are attending college, ranging from 0 to 6.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - College Dependent Count
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"int","confidence":0.99,"glossary_terms":["College Dependent Count"]}'
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"kind":"dimension","confidence":0.95,"run_id":"20260922T000009Z"}'
  primary_key:
  - cd_demo_sk
- name: date_dim
  source: tpcds.date_dim
  description: A comprehensive calendar dimension table containing one row per day from 1900 to 2100, with calendar attributes
    (year, month, day, quarter, week), fiscal period mappings, day-of-week and holiday indicators, and period-over-period
    comparison keys for analyzing sales and business events across time.
  fields:
  - name: d_date_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_date_sk
    label: Date Surrogate Key
    description: Unique surrogate key for each calendar date, used as the primary identifier and foreign key in fact tables.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Calendar Date
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"identifier","engine_type":"bigint","confidence":0.99,"glossary_terms":["Calendar Date"]}'
  - name: d_date_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_date_id
    label: Date ID
    description: Alternate unique identifier for each calendar date in string format.
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Calendar Date
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"identifier","engine_type":"string","confidence":0.99,"glossary_terms":["Calendar Date"]}'
  - name: d_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_date
    label: Calendar Date
    description: The actual calendar date (YYYY-MM-DD format) represented by this row.
    datatype: Date
    dimension:
      is_time: true
    ai_context:
      synonyms:
      - Calendar Date
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"time","engine_type":"date","confidence":0.99,"glossary_terms":["Calendar Date"]}'
  - name: d_month_seq
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_month_seq
    label: Month Sequence
    description: A monotonically increasing sequence number for each month, useful for period arithmetic and calculating month-over-month
      intervals.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Month
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.92,"glossary_terms":["Month"]}'
  - name: d_week_seq
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_week_seq
    label: Week Sequence
    description: A monotonically increasing sequence number for each week, useful for week-over-week analysis and period calculations.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Week
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.92,"glossary_terms":["Week"]}'
  - name: d_quarter_seq
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_quarter_seq
    label: Quarter Sequence
    description: A monotonically increasing sequence number for each quarter, useful for quarter-over-quarter analysis and
      period calculations.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Quarter
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.92,"glossary_terms":["Quarter"]}'
  - name: d_year
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_year
    label: Calendar Year
    description: The calendar year (1900–2100) of the date, used for annual grouping and year-over-year comparisons.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Calendar Year
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.99,"glossary_terms":["Calendar Year"]}'
  - name: d_dow
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_dow
    label: Day of Week Number
    description: Numeric day of week (0–6), where 0 typically represents Sunday, used for weekday-based analysis and filtering.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Day of Week
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.95,"glossary_terms":["Day of Week"]}'
  - name: d_moy
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_moy
    label: Month of Year
    description: The month number (1–12) within the calendar year, used for monthly grouping and seasonal analysis.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Month
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.99,"glossary_terms":["Month"]}'
  - name: d_dom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_dom
    label: Day of Month
    description: The day number (1–31) within the calendar month, used for intra-month analysis and date positioning.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Day of Week
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.95,"glossary_terms":["Day of Week"]}'
  - name: d_qoy
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_qoy
    label: Quarter of Year
    description: The quarter number (1–4) within the calendar year, used for quarterly grouping and seasonal analysis.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Quarter
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.99,"glossary_terms":["Quarter"]}'
  - name: d_fy_year
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_fy_year
    label: Fiscal Year
    description: The fiscal year of the date, used for fiscal period grouping and year-over-year comparisons aligned to the
      organization's fiscal calendar.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Fiscal Year
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.95,"glossary_terms":["Fiscal Year"]}'
  - name: d_fy_quarter_seq
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_fy_quarter_seq
    label: Fiscal Quarter Sequence
    description: A monotonically increasing sequence number for each fiscal quarter, useful for fiscal period arithmetic and
      comparisons.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Fiscal Year
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.9,"glossary_terms":["Fiscal Year"]}'
  - name: d_fy_week_seq
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_fy_week_seq
    label: Fiscal Week Sequence
    description: A monotonically increasing sequence number for each fiscal week, useful for fiscal week-over-week analysis
      and period calculations.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Fiscal Year
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"bigint","confidence":0.9,"glossary_terms":["Fiscal Year"]}'
  - name: d_day_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_day_name
    label: Day of Week Name
    description: The name of the day of the week (e.g., Monday, Tuesday), used for readable day-based filtering and reporting.
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Day of Week
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"string","confidence":0.99,"glossary_terms":["Day of Week"]}'
  - name: d_quarter_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_quarter_name
    label: Quarter Name
    description: A formatted quarter label (e.g., '2023Q1') combining the year and quarter number for readable period identification.
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Quarter
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"attribute","engine_type":"string","confidence":0.95,"glossary_terms":["Quarter"]}'
  - name: d_holiday
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_holiday
    label: Is Holiday
    description: Flag ('Y' or 'N') indicating whether the date is a recognized holiday, used for holiday-specific analysis
      and filtering.
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Holiday
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"string","confidence":0.98,"glossary_terms":["Holiday"]}'
  - name: d_weekend
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_weekend
    label: Is Weekend
    description: Flag ('Y' or 'N') indicating whether the date falls on a weekend (Saturday or Sunday), used for weekend vs.
      weekday analysis.
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Weekend
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"string","confidence":0.99,"glossary_terms":["Weekend"]}'
  - name: d_following_holiday
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_following_holiday
    label: Following Holiday
    description: Flag ('Y' or 'N') indicating whether the date is immediately followed by a holiday, used to identify pre-holiday
      periods.
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Holiday
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"dimension","engine_type":"string","confidence":0.95,"glossary_terms":["Holiday"]}'
  - name: d_first_dom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_first_dom
    label: First Day of Month Surrogate Key
    description: Surrogate key pointing to the first day of the month containing this date, enabling month-start analysis
      and calculations.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Month
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"foreign_key","engine_type":"bigint","confidence":0.9,"glossary_terms":["Month"]}'
  - name: d_last_dom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_last_dom
    label: Last Day of Month Surrogate Key
    description: Surrogate key pointing to the last day of the month containing this date, enabling month-end analysis and
      calculations.
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - Month
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"role":"foreign_key","engine_type":"bigint","confidence":0.9,"glossary_terms":["Month"]}'
  - name: d_same_day_ly
