[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-core"
version = "0.1.0"
description = "Helios core: shared semantic query and data governance layer"
authors = [{name = "Helios Team"}]
license = "Apache-2.0"
requires-python = ">=3.11"
# The base install: the compiler, semantic model, DuckDB, and the model registry on
# SQLite (SQLAlchemy and Alembic; the database itself is the standard library).
# Everything else is an extra; tests/test_optional_dependencies.py keeps it so.
dependencies = [
    "duckdb>=1.3.0",
    "jsonschema>=4.23.0",
    "platformdirs>=4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.0", # semantic model files and ontology mappings
    "sqlglot>=27.0.0",
    "sqlalchemy>=2.0", # the model registry (SQLite by default) and the sqlalchemy engine
    "alembic>=1.13", # registry schema migrations
]

[project.optional-dependencies]
# LLM providers (helios_core.llm), used to propose models.
llm = [
    "httpx>=0.27.0",
]
# LinkML ontology parsing (helios_core.ontology.parser).
ontology = [
    "linkml-runtime>=1.8.0",
]
# Postgres for the registry (postgresql+psycopg://...) and the sqlalchemy engine. Other
# databases: install their SQLAlchemy driver (snowflake-sqlalchemy, mysqlclient, ...).
postgres = [
    "psycopg[binary]>=3.2",
]
# The trino engine plugin (all three identity modes).
trino = [
    "trino>=0.330",
]
# Object storage ([s3], [azure], [gcs]) arrives with the artifact store backends (4.3).
# Searching crawled documents. Without these, crawls run and evidence search
# reports that it is unavailable. sentence-transformers brings PyTorch.
evidence = [
    "lancedb>=0.39.0",
    "sentence-transformers>=6.1.0",
]

# The built-in engine plugins. Impala and Atlas come with helios-cloudera
# (see helios_core.plugins). trino needs its extra; sqlalchemy needs the database's driver.
[project.entry-points."helios.engines"]
duckdb = "helios_core.engines.duckdb_engine:DuckDBEngine"
sqlalchemy = "helios_core.engines.sqlalchemy_engine:SqlAlchemyEngine"
trino = "helios_core.engines.trino_engine:TrinoEngine"

[tool.hatch.build.targets.wheel]
packages = ["src/helios_core"]
