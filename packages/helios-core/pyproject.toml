[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-core"
version = "0.1.0"
description = "Helios core: shared semantic query and data governance layer"
authors = [{name = "Helios Team"}]
license = "Apache-2.0"
requires-python = ">=3.11"
# The base install: the compiler, semantic model, DuckDB and SQLite (stdlib).
# Everything else is an extra; tests/test_optional_dependencies.py keeps it so.
dependencies = [
    "duckdb>=1.3.0",
    "jsonschema>=4.23.0",
    "platformdirs>=4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.0", # semantic model files and ontology mappings
    "sqlglot>=27.0.0",
]

[project.optional-dependencies]
# LLM providers (helios_core.llm), used to propose models.
llm = [
    "httpx>=0.27.0",
]
# LinkML ontology parsing (helios_core.ontology.parser).
ontology = [
    "linkml-runtime>=1.8.0",
]
# The sqlalchemy engine plugin; add the database's own driver (psycopg, snowflake-sqlalchemy, ...).
sqlalchemy = [
    "sqlalchemy>=2.0",
]
# Storage backends ([postgres], [s3], [azure], [gcs]) arrive with their stores in Phase 4.
# Searching crawled documents. Without these, crawls run and evidence search
# reports that it is unavailable. sentence-transformers brings PyTorch.
evidence = [
    "lancedb>=0.39.0",
    "sentence-transformers>=6.1.0",
]

# The built-in engine plugins. Impala and Atlas come with helios-cloudera
# (see helios_core.plugins). sqlalchemy needs the [sqlalchemy] extra.
[project.entry-points."helios.engines"]
duckdb = "helios_core.engines.duckdb_engine:DuckDBEngine"
sqlalchemy = "helios_core.engines.sqlalchemy_engine:SqlAlchemyEngine"

[tool.hatch.build.targets.wheel]
packages = ["src/helios_core"]
