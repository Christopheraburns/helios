[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-cloudera"
version = "0.2.0"
description = "Helios plugins for Cloudera: the Impala engine and the Atlas catalog"
readme = "README.md"
authors = [{name = "Helios Team"}]
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["cloudera", "impala", "atlas", "semantic layer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "helios-cortex>=0.2.0",
    "impyla>=0.20.0",
    "pydantic-settings>=2.6",
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/christopheraburns/helios"
Documentation = "https://github.com/christopheraburns/helios/tree/main/packages/helios-cloudera#readme"
Repository = "https://github.com/christopheraburns/helios"
Issues = "https://github.com/christopheraburns/helios/issues"

[project.entry-points."helios.engines"]
impala = "helios_cloudera.impala:ImpalaEngine"

[project.entry-points."helios.catalogs"]
atlas = "helios_cloudera.atlas:AtlasClient"

[project.entry-points."helios.commands"]
impala = "helios_cloudera.commands:ImpalaCommand"

# helios --profile workbench: the Workbench environment variables, read into Settings.
[project.entry-points."helios.profiles"]
workbench = "helios_cloudera.workbench:WorkbenchSettings"

[tool.hatch.build.targets.wheel]
packages = ["src/helios_cloudera"]
