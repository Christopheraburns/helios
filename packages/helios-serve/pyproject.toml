[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-serve"
version = "0.1.0"
description = "Helios tools: list, describe, compile and query published semantic models, as plain Python functions"
authors = [{name = "Helios Team"}]
license = "Apache-2.0"
requires-python = ">=3.11"
# helios-cortex only. No MCP SDK and no web framework: the tools are plain functions with
# metadata; Daedalus (shared) and helios-mcp (local stdio) serve them over MCP.
dependencies = [
    "helios-cortex",
]

# The tool registry (helios_serve.load_registry) reads this group; the entry-point name
# is the tool's name. explain_lineage is offered only beside a catalog with lineage.
[project.entry-points."helios.tools"]
list_models = "helios_serve.tools:list_models"
describe_model = "helios_serve.tools:describe_model"
search_semantics = "helios_serve.tools:search_semantics"
describe = "helios_serve.tools:describe"
compile_query = "helios_serve.tools:compile_query"
run_query = "helios_serve.tools:run_query"
explain_lineage = "helios_serve.tools:explain_lineage"

[tool.hatch.build.targets.wheel]
packages = ["src/helios_serve"]
