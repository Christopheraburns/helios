[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-serve"
version = "0.2.0"
description = "Helios tools: list, describe, compile and query published semantic models, as plain Python functions"
readme = "README.md"
authors = [{name = "Helios Team"}]
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["semantic layer", "text-to-sql", "llm tools", "ossie", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
# helios-cortex only. No MCP SDK and no web framework: the tools are plain functions with
# metadata; Daedalus (shared) and helios-mcp (local stdio) serve them over MCP.
dependencies = [
    "helios-cortex>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/christopheraburns/helios"
Documentation = "https://github.com/christopheraburns/helios/tree/main/packages/helios-serve#readme"
Repository = "https://github.com/christopheraburns/helios"
Issues = "https://github.com/christopheraburns/helios/issues"

[project.optional-dependencies]
# helios eval and helios_serve.evaluation talk to an LLM (helios-cortex's LLM client).
eval = ["helios-cortex[llm]>=0.2.0"]

# The tool registry (helios_serve.load_registry) reads this group; the entry-point name
# is the tool's name. explain_lineage is offered only beside a catalog with lineage.
[project.entry-points."helios.tools"]
list_models = "helios_serve.tools:list_models"
describe_model = "helios_serve.tools:describe_model"
search_semantics = "helios_serve.tools:search_semantics"
describe = "helios_serve.tools:describe"
compile_query = "helios_serve.tools:compile_query"
run_query = "helios_serve.tools:run_query"
explain_lineage = "helios_serve.tools:explain_lineage"

# helios eval: run an evaluation suite through the tools.
[project.entry-points."helios.commands"]
eval = "helios_serve.commands:EvalCommand"

[tool.hatch.build.targets.wheel]
packages = ["src/helios_serve"]
