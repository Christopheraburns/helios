name: helios

on:
  pull_request:
    paths-ignore:
      - "apps/helios-ds-generation/**"
      - "apps/helios-ds-evaluation/**"
      - "docs/**"
  push:
    branches: [main]
    tags: ["helios-*/v*"]          # a release of one package: helios-<package>/vX.Y.Z
  schedule:
    - cron: "17 5 * * *"           # nightly: everything, plus the plugins' live jobs
  workflow_dispatch:

concurrency:
  group: helios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per package (burndown 8.5). In the workspace: ruff, mypy and the package's
  # tests. Then from wheels: the package installed beside only the Helios packages it
  # declares (`wheels`), its tests run again outside the workspace, and the `helios`
  # command starts; `extra` reinstalls with an extra (and `extra_wheels`) and reruns them.
  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: helios-cortex            # the base install: no extras (3.2)
            wheels: helios-cortex
          - package: helios-model             # beside a base helios-cortex (5.1)
            wheels: helios-cortex helios-model
          - package: helios-serve             # no MCP SDK, no web framework (6.1)
            wheels: helios-cortex helios-serve
            extra: helios_cortex:llm          # the eval extra's LLM client (6.5)
          - package: helios-semantic          # the facade without Cloudera or an LLM, then [all] (6.6)
            wheels: helios-cortex helios-model helios-serve helios-semantic
            extra: helios_semantic:all
            extra_wheels: helios-cloudera
          - package: helios-mcp               # beside helios-serve and helios-cortex alone (7.1)
            wheels: helios-cortex helios-serve helios-mcp
          - package: helios-cloudera          # helios-model for the two harvest tests (3.3)
            wheels: helios-cortex helios-cloudera helios-model
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12" # matches the helios Workbench runtime
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check packages/${{ matrix.package }}
      - run: uv run mypy packages/${{ matrix.package }}/src
      - run: uv run pytest -q -rs packages/${{ matrix.package }}/tests
      - name: Install from wheels
        run: |
          for p in ${{ matrix.wheels }} ${{ matrix.extra_wheels }}; do uv build --package "$p" --wheel --out-dir dist; done
          wheels=()
          for p in ${{ matrix.wheels }}; do wheels+=(dist/"${p//-/_}"-*.whl); done
          uv venv "$RUNNER_TEMP/wheels"
          uv pip install --python "$RUNNER_TEMP/wheels/bin/python" "${wheels[@]}" pytest
      - name: Test from wheels
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheels/bin/python" -m pytest -q -rs -p no:cacheprovider "$GITHUB_WORKSPACE/packages/${{ matrix.package }}/tests"
          "$RUNNER_TEMP/wheels/bin/helios" --help
      - name: Test from wheels with ${{ matrix.extra }}
        if: matrix.extra != ''
        run: |
          extra="${{ matrix.extra }}"
          others=()
          for p in ${{ matrix.extra_wheels }}; do others+=(dist/"${p//-/_}"-*.whl); done
          uv pip install --python "$RUNNER_TEMP/wheels/bin/python" "$(ls dist/"${extra%%:*}"-*.whl)[${extra#*:}]" "${others[@]}"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheels/bin/python" -m pytest -q -rs -p no:cacheprovider "$GITHUB_WORKSPACE/packages/${{ matrix.package }}/tests"

  # What crosses packages: the import contracts, the integration suite (the facade on the
  # DuckDB TPC-DS sample, identity end to end, one helios.toml) and the crawler's tests.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run lint-imports
      - run: uv run ruff check apps/helios examples scripts tests
      - run: uv run pytest -q -rs tests/integration apps/helios/tests

  # The Trino engine against a real coordinator (burndown 3.8): harvest, profile,
  # a compiled metric, and impersonation on an open cluster's memory catalog.
  trino:
    runs-on: ubuntu-latest
    services:
      trino:
        image: trinodb/trino:484
        ports: ["8080:8080"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Wait for Trino to start
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/v1/info | grep -q '"starting":false' && exit 0
            sleep 3
          done
          echo "Trino did not start"; exit 1
      - run: uv run pytest -q -rs packages/helios-cortex/tests/test_trino_live.py packages/helios-model/tests/test_trino_discovery.py
        env:
          HELIOS_TEST_TRINO: localhost:8080

  # The backend conformance suite on shared backends (burndown 4.6): the registry on
  # Postgres and the artifact store on S3. The package jobs run the same suite on
  # SQLite and a local directory. S3 is a moto server: MinIO no longer publishes images.
  storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: helios
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      s3:
        image: motoserver/moto:5.2.5
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          uv run pytest -q -rs
          packages/helios-cortex/tests/test_registry.py
          packages/helios-cortex/tests/test_registry_sql.py
          packages/helios-cortex/tests/test_artifact_storage.py
          packages/helios-cortex/tests/test_conformance.py
        env:
          HELIOS_TEST_POSTGRES: postgresql+psycopg://postgres:helios@localhost:5432/postgres
          HELIOS_TEST_S3: http://localhost:5000
          HELIOS_TEST_S3_KEY: helios
          HELIOS_TEST_S3_SECRET: helios-secret

  # helios-cloudera's live test, nightly (burndown 8.5 and 9.9): its Impala engine against
  # a real warehouse holding TPC-DS, which the unit tests replace with a stand-in for
  # impyla. The compiled TPC-DS metrics are checked against hand-written SQL, and
  # impersonation when a delegate is set. Like the trino job for helios-cortex's Trino
  # engine, it tests one plugin; a new warehouse plugin adds its own live job.
  # Needs repository secrets HELIOS_TEST_IMPALA, HELIOS_TEST_IMPALA_USER and
  # HELIOS_TEST_IMPALA_PASSWORD (HELIOS_TEST_IMPALA_DELEGATE optional); it fails rather
  # than skips without them, so a nightly run never passes by testing nothing.
  cloudera-live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HELIOS_TEST_IMPALA: ${{ secrets.HELIOS_TEST_IMPALA }}
      HELIOS_TEST_IMPALA_USER: ${{ secrets.HELIOS_TEST_IMPALA_USER }}
      HELIOS_TEST_IMPALA_PASSWORD: ${{ secrets.HELIOS_TEST_IMPALA_PASSWORD }}
      HELIOS_TEST_IMPALA_DELEGATE: ${{ secrets.HELIOS_TEST_IMPALA_DELEGATE }}
    steps:
      - name: Check the Impala secrets are set
        run: test -n "$HELIOS_TEST_IMPALA" -a -n "$HELIOS_TEST_IMPALA_USER" -a -n "$HELIOS_TEST_IMPALA_PASSWORD" || { echo "set the HELIOS_TEST_IMPALA secrets"; exit 1; }
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q -rs packages/helios-cloudera/tests/test_impala_live.py

  # A tag helios-<package>/vX.Y.Z builds that package and uploads it to the internal
  # index, once every package job and the integration suite pass. PyPI is burndown 9.5.
  # Needs repository secrets HELIOS_INDEX_URL and HELIOS_INDEX_TOKEN.
  publish:
    if: startsWith(github.ref, 'refs/tags/helios-')
    needs: [package, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check the tag names a package and its version
        id: tag
        run: |
          package="${GITHUB_REF_NAME%/v*}"
          tag="${GITHUB_REF_NAME##*/v}"
          test -f "packages/$package/pyproject.toml" || { echo "no package $package"; exit 1; }
          version="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "packages/$package/pyproject.toml")"
          test "$tag" = "$version" || { echo "tag $tag != $package $version"; exit 1; }
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - run: uv build --package "${{ steps.tag.outputs.package }}" --out-dir dist
      - run: uv publish --publish-url "$HELIOS_INDEX_URL" --token "$HELIOS_INDEX_TOKEN" dist/*
        env:
          HELIOS_INDEX_URL: ${{ secrets.HELIOS_INDEX_URL }}
          HELIOS_INDEX_TOKEN: ${{ secrets.HELIOS_INDEX_TOKEN }}
