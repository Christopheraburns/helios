<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}helios{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/console.css">
<link rel="stylesheet" href="/static/review.css">
</head>
<body>
<nav>
  <a class="brand" href="/">helios<small>console v{{ version }}</small></a>
  <a class="item {% if active == 'health' %}active{% endif %}" href="/">Health</a>
  <a class="item {% if active == 'glossary' %}active{% endif %}" href="/glossary">Glossary</a>
  <a class="item {% if active == 'runs' %}active{% endif %}" href="/runs">Runs</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
