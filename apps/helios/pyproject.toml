[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios"
version = "0.8.0"
description = "Helios: semantic query layer for governed enterprise data"
authors = [{name = "Helios Team"}]
requires-python = ">=3.11"
dependencies = [
    "helios-core @ {path=../../shared/helios_core}",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "black>=23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["console", "mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../shared"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true

[tool.ruff]
line-length = 100
target-version = "py311"
