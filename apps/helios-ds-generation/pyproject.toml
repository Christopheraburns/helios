[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-ds"
version = "0.1.0"
description = "Helios-DS: deterministic synthetic enterprise data generator"
authors = [{name = "Helios Team"}]
requires-python = ">=3.11"
dependencies = [
    "helios-core @ {path=../../shared/helios_core}",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "pyiceberg>=0.5.0",
    "reportlab>=4.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
media = [
    "ffmpeg-python>=0.2",
    "espeak-ng-python>=0.2",
]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/helios_ds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../shared"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src:../../shared"
packages = ["helios_ds", "helios_ds_generation"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*", "cml", "cml.*", "cmlapi", "cmlapi.*", "impala", "impala.*", "pyarrow", "pyarrow.*", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["helios_core", "helios_core.*"]
follow_imports = "silent"
