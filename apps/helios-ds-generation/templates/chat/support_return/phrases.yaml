# Phrase bank for the internal support chat about a damaged-item return.
# Speakers: agent (customer care), supervisor, inspector (returns desk).
# A flow is an ordered conversation; fillers are optional extra turns.
# {name} fills a value; {@name} places a tracked entity mention.

flows:
  - - [agent, "Got an email from {@customer} about return {@rma}, the {@item} from {@store}."]
    - [inspector, "Yep, I logged that one. Box was crushed, item has dents on the side."]
    - [agent, "Customer wants the {refund} refund. Anything blocking it?"]
    - [supervisor, "Damage is on the carrier, not the customer. Approve it."]
    - [agent, "Done, refund queued under case {case_number}."]
  - - [supervisor, "Who's handling {@rma}? The customer emailed twice."]
    - [agent, "Me. It's {@first_name}'s {@item} ({@item_id}), returned {return_date_long} at {@store}."]
    - [inspector, "Inspection notes: outer carton torn, product scuffed. Reason on the slip is \"{@reason}\"."]
    - [supervisor, "OK, full refund of {refund} please."]
    - [agent, "Processing now. Original receipt ticket was {@ticket}."]
  - - [agent, "Quick check on {@rma}: did the {@item} actually come back damaged?"]
    - [inspector, "It did. Packaging damage, looks like it was dropped."]
    - [agent, "Great, then I'll tell {@customer} the refund is approved."]
    - [supervisor, "Tag it as a carrier damage claim too, we're seeing more of these from {@store}."]
  - - [inspector, "Heads up: {@item_id} came back from {@store} with a crushed box again."]
    - [agent, "That's the {@rma} return for {@customer}."]
    - [supervisor, "How many of those this month?"]
    - [inspector, "A few. Same brand, {@brand}."]
    - [agent, "I'll refund {refund} and note the pattern on case {case_number}."]

fillers:
  - [agent, "Sorry, stepping away for a minute."]
  - [supervisor, "Thanks for jumping on this."]
  - [inspector, "Photos are attached to the case."]
  - [agent, "Customer was polite about it, for what it's worth."]
  - [supervisor, "Let's make sure this doesn't sit in the queue."]
