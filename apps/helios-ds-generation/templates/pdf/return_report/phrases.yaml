# Phrase bank for the store's return authorization report (PDF).
# {name} fills a value; {@name} places a tracked entity mention.

title:
  - "Return Authorization Report"
  - "Returned Merchandise Report"
  - "Return Inspection Report"

intro:
  - "The item below was returned at {@store} ({store_location}) on {return_date_long} and inspected at the returns desk."
  - "Return {@rma} was received at store {@store_id} on {return_date_long}."
  - "Customer {@customer} returned the following merchandise to {@store} on {return_date_long}."
  - "{@customer_formal} brought the {@item_desc} back to the {@store_city} on {return_date_long}; details below."

inspection:
  - "Outer packaging crushed on two corners; product shows impact marks consistent with a drop in transit."
  - "Carton torn open on arrival. Contents shifted and the item is scuffed along one side."
  - "Packaging damaged; interior padding missing. Item has visible dents but no missing parts."
  - "Box compressed and resealed with tape by a third party. Item surface scratched."

reason_line:
  - "Recorded return reason: {@reason}."
  - "Reason code on file: {@reason}."

disposition:
  - "Disposition: full refund of {refund} approved; item written off as carrier damage."
  - "Disposition: refund {refund} to original tender; item sent to vendor for claim."
  - "Disposition: refund of {refund} issued; item quarantined pending carrier claim."

footer:
  - "This report is generated by the returns desk. Retain with the original receipt."
  - "Internal document. Refer questions to Customer Care with the RMA number."
