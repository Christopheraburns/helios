# What each TPC-DS (category, class) looks like, for image prompts.
# DRAFT for review (2026-10-01; revised after the first pilot images). TPC-DS item names and descriptions are random
# text, so an item's appearance comes from category, class and color only.
#
#   object:    the product, with {color} where its color shows
#   packaging: what it ships in (used for damaged-packaging edits)
#   sized:     true if TPC-DS i_size (small/medium/large/...) describes it
#   label:     "title" prints the TPC-DS product name as the title (books, music):
#              text that is natural on the product, recorded so OCR can verify it
#   detail:    a visual cue that makes the product recognisable (cover art)
#
# Rows with a missing category or class (45 of 9,000 items) are not imaged.

