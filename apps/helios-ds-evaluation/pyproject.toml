[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-ds-eval"
version = "0.1.0"
description = "Helios-DS: evaluation harness for synthetic enterprise data"
authors = [{name = "Helios Team"}]
requires-python = ">=3.11"
dependencies = [
    "helios-core @ {path=../../shared/helios_core}",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "pyiceberg>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/helios_ds_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../shared"]

[tool.ruff]
line-length = 100
target-version = "py311"
